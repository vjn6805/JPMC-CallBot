<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JPMC Employee Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f4efe7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2E1E14;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(143, 90, 57, 0.04) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid #e5decb;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(143, 90, 57, 0.04), 0 1px 3px rgba(143, 90, 57, 0.02);
      width: 400px;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #8f5a39;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: #8f5a39;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 13px;
      color: #5C4538;
      margin-bottom: 36px;
      line-height: 1.6;
      font-weight: 500;
    }

    .phone-input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .phone-input-wrapper input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 6px;
      border: 1px solid #cbbfab;
      background: #f4efe7;
      color: #2E1E14;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      text-align: center;
      font-weight: 500;
    }

    .phone-input-wrapper input::placeholder { color: #917A6A; }
    .phone-input-wrapper input:focus {
      border-color: #8f5a39;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(143, 90, 57, 0.1);
    }

    .call-btn {
      width: 100%;
      padding: 14px;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, #8f5a39 0%, #6d4123 100%);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(143, 90, 57, 0.15);
    }

    .call-btn:hover:not(:disabled) {
      background: #6d4123;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(143, 90, 57, 0.25);
    }

    .call-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .call-btn.calling {
      background: linear-gradient(135deg, #1B4D3E 0%, #0F3227 100%);
      animation: pulse-btn 1.5s infinite;
      box-shadow: 0 4px 12px rgba(27, 77, 62, 0.15);
    }

    .call-btn.error-state {
      background: linear-gradient(135deg, #9E2A2B, #781B1C);
    }

    @keyframes pulse-btn {
      0%, 100% { box-shadow: 0 0 0 0 rgba(27, 77, 62, 0.4); }
      50% { box-shadow: 0 0 0 10px rgba(27, 77, 62, 0); }
    }

    .phone-icon { font-size: 16px; }

    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #5C4538;
      min-height: 20px;
      transition: color 0.3s;
      font-weight: 600;
    }

    .status.success { color: #1B4D3E; }
    .status.error   { color: #9E2A2B; }
    .status.calling { color: #8f5a39; }

    .features {
      margin-top: 36px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .feature-tag {
      background: #FFFFFF;
      border: 1px solid #e5decb;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #5C4538;

      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .feature-tag:hover {
      border-color: #CBD5E1;
      background: #FFFFFF;
      transform: translateY(-1px);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #A18A4F;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="card">
    <div class="logo">JPMorgan Chase</div>
    <h1>Employee Assistant</h1>
    <p class="subtitle">Enter your registered number and we'll call you. Your identity will be verified automatically.</p>

    <div class="phone-input-wrapper">
      <input
        type="tel"
        id="phoneInput"
        placeholder="+91XXXXXXXXXX"
        maxlength="15"
      />
    </div>

    <button class="call-btn" id="callBtn" onclick="initiateCall()">
      <span class="phone-icon">📞</span>
      <span id="btnText">Call Me Now</span>
    </button>

    <p class="status" id="status"></p>

    <div class="features">
      <div class="feature-tag"><div class="dot"></div>IT Helpdesk</div>
      <div class="feature-tag"><div class="dot"></div>Room Booking</div>
      <div class="feature-tag"><div class="dot"></div>Food Ordering</div>
      <div class="feature-tag"><div class="dot"></div>Shuttle Booking</div>
      <div class="feature-tag"><div class="dot"></div>HR Policies</div>
      <div class="feature-tag"><div class="dot"></div>Dev Guides</div>
    </div>
  </div>

  <script>
    async function initiateCall() {
      const btn       = document.getElementById('callBtn');
      const btnText   = document.getElementById('btnText');
      const status    = document.getElementById('status');
      const phoneInput = document.getElementById('phoneInput');
      const phone     = phoneInput.value.trim();

      if (!phone || phone.length < 10) {
        status.textContent = 'Please enter a valid phone number with country code.';
        status.className   = 'status error';
        return;
      }

      btn.disabled     = true;
      btn.className    = 'call-btn calling';
      btnText.textContent = 'Calling you...';
      status.textContent  = 'Initiating call, please wait...';
      status.className    = 'status calling';

      try {
        const res  = await fetch('/call/outbound', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: phone })
        });

        const data = await res.json();

        if (data.success) {
          btnText.textContent = 'Incoming call on the way!';
          status.textContent  = `📲 Your phone will ring shortly. Answer to speak with Alex.`;
          status.className    = 'status success';

          // Reset after 30 seconds
          setTimeout(() => {
            btn.disabled        = false;
            btn.className       = 'call-btn';
            btnText.textContent = 'Call Me Now';
            status.textContent  = '';
            status.className    = 'status';
          }, 30000);
        } else {
          throw new Error(data.error || 'Call failed');
        }
      } catch (err) {
        btn.disabled        = false;
        btn.className       = 'call-btn error-state';
        btnText.textContent = 'Try Again';
        status.textContent  = err.message.includes('not registered')
          ? '❌ This number is not registered with JPMC.'
          : '❌ Could not initiate call. Please try again.';
        status.className    = 'status error';

        setTimeout(() => { btn.className = 'call-btn'; }, 3000);
      }
    }

    // Allow pressing Enter to trigger call
    document.getElementById('phoneInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') initiateCall();
    });
  </script>
</body>
</html>
